                <div id="left-bar">

</div>
<div id="fh-popup">
  <div class="cp-title">القلم الفسفوري</div>
  <div class="cp-grid" id="fh-color-grid"></div>
  <div class="fh-thickness-row"><label>السمك:</label><input type="range" id="fh-thickness-slider" min="4" max="40" value="18"><span class="fh-thickness-val" id="fh-thickness-val">18</span></div>
  <div class="fh-thickness-row"><label>الشفافية:</label><input type="range" id="fh-opacity-slider" min="10" max="95" step="5" value="90"><span class="fh-thickness-val" id="fh-opacity-val">90%</span></div>
</div>
<div id="shape-dimensions" class="shape-dimensions idle" style="display:none">
  <div class="dim-cell off"><label>L</label><input type="number" id="dim-width" disabled></div>
  <div class="dim-cell off"><label>W</label><input type="number" id="dim-height" disabled></div>
  <div class="dim-cell off"><label>Theta</label><input type="number" id="dim-theta" step="any" disabled></div>
  <div class="dim-cell off"><label>r</label><input type="number" id="dim-r" step="any" disabled></div>
  <div class="dim-cell off"><label>x</label><input type="number" id="dim-x" step="any" disabled></div>
  <div class="dim-cell off"><label>y</label><input type="number" id="dim-y" step="any" disabled></div>
  <div class="dim-cell off"><label>HR</label><input type="number" id="dim-tilt-h" disabled></div>
  <div class="dim-cell off"><label>VR</label><input type="number" id="dim-tilt-v" disabled></div>
  <div class="dim-cell off"><label>Tr%</label><input type="number" id="dim-alpha" disabled></div>
</div>
<div class="edit-info" id="editInfo" style="display:none"></div>
<input type="file" id="f-unified" class="hd" accept=".pdf,image/*,.json,.sbm">
<input type="file" id="f-image-only" class="hd" accept="image/*">
<textarea id="text-editor" spellcheck="false" style="display:none" placeholder="اكتب هنا..."></textarea>

<script>
  document.getElementById('backBtn').onclick = () => {
    if (confirm('إنهاء الحصة والرجوع؟')) location.href = '../index.html';
  };
  const bindSaved = (id, key, def) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = localStorage.getItem(key) || def;
    el.addEventListener('input', () => localStorage.setItem(key, el.value));
  };
  bindSaved('lessonTitleInput', 'lesson_title', 'فيزياء - الدرس الأول');
  bindSaved('fileTitleInput', 'file_area_title', 'منطقة الملفات');
  document.getElementById('meetBtn').onclick = () => {
    const u = prompt('الصق رابط Meet:', localStorage.getItem('meet_url') || 'https://meet.google.com/new');
    if (u) { localStorage.setItem('meet_url', u); window.open(u, '_blank'); }
  };
</script>
<script type="module" src="room.js"></script>
</body>
</html>
